name: CI

# Runs on every push and pull request. Four concerns, four jobs:
#   check    — lint + test + pyz build across the OS x Python matrix (mirrors
#              `just check`).
#   science  — one extra runner that installs the heavy data-science extras and
#              runs the suite, so the paths the `thin` matrix leaves
#              importorskip'd are covered on every push, not only at tag time.
#   coverage — one suite run measuring abax/core + abax/engine; ratchets both
#              (core floor 81, engine floor 57) on a single runner.
#   bench    — recalc throughput + memory regression gate vs a committed baseline.
# Windows AppContainer confinement — confined code may write its scratch dir and
# may NOT write beside it or open a socket — is verified by the `check` matrix's
# four windows-latest cells, on every push. It used to be skipped on Actions
# entirely, on a claim that hosted runners cannot launch a confined child; two
# probe runs disproved that (see tests/conftest.py). The one test still gated
# there reaches the confinement through ConsoleBridge and is covered by the
# opt-in .github/workflows/sandbox-e2e.yml, kept separate so a run that is
# expected to fail cannot turn this one red.
on:
  push:
  pull_request:

# One in-flight run per ref; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  # Make `just` use the exact setup-python interpreter (its `python` is on PATH on
  # every runner). The justfile's Windows default is the `py` launcher, which on a
  # runner can select a newer Python that lacks the installed dev deps.
  JUST_PYTHON: python

jobs:
  # ── Lint + test + pyz across OS x Python (the `just check` matrix) ──────────
  # abax core is stdlib-only; the tests exercise the GUI/TUI/science front-ends
  # when those extras are present. We install the `dev` extra (pytest, ruff,
  # build, pytest-cov) plus `thin` (GUI + lightweight conveniences) — the same
  # surface `just install` sets up — so the suite runs the same code paths CI
  # can support without pulling the ~0.84 GB full-fat stack.
  check:
    name: check (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install just
        uses: extractions/setup-just@v3

      # PySide6 6.11 dynamically links libEGL/libGL even under the offscreen
      # platform, and ubuntu-latest doesn't ship them — without these the Qt
      # imports fail at collection (libEGL.so.1: cannot open shared object file).
      - name: Install headless Qt system libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install project (dev + thin extras)
        run: python -m pip install -e ".[dev,thin]"

      # Headless Qt on Linux needs an X server surrogate; the GUI tests import a
      # QApplication. macOS/Windows runners ship a usable windowing layer.
      - name: Run just check (Linux, headless Qt)
        if: runner.os == 'Linux'
        run: xvfb-run -a just check
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Run just check (macOS / Windows)
        if: runner.os != 'Linux'
        run: just check
        env:
          QT_QPA_PLATFORM: offscreen

  # ── The Windows confinement tier, in parallel ──────────────────────────────
  # The `check` matrix runs the suite SERIALLY (`just test` has no `-n auto`),
  # and the only job that runs it in parallel is `science`, on Ubuntu — where
  # the Windows tier does not apply. So no cell anywhere ran this tier with more
  # than one process, and issue #12 lived in that gap: holder records, which are
  # how separate abax processes tell each other "I am still using these
  # machine-wide ACEs", hung off a directory the test fixtures redirect per
  # test. Every process looked somewhere private, found nobody, and swept ACEs
  # out from under another process's live confined worker.
  #
  # It takes two real processes to see, which is the whole reason this job
  # exists. Serially it is invisible: the tier passed 157/157 on the same commit
  # that failed 2-3 tests per run under `-n auto`.
  #
  # One cell, three files, a couple of minutes. Deliberately not folded into the
  # 12-cell matrix — this is about process count, not about Python versions.
  sandbox-xdist:
    name: windows confinement tier (parallel, issue #12)
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project (dev + thin extras)
        run: python -m pip install -e ".[dev,thin]"

      # Twice, because the failure was intermittent: a single green run is weak
      # evidence about a race. Two costs another ~2 minutes and roughly squares
      # the chance of noticing.
      - name: Run the confinement tier under xdist (twice)
        run: |
          python -m pytest tests/test_sandbox.py tests/test_sandbox_windows.py tests/test_sandbox_gate.py -n auto -q --timeout=300 --timeout-method=thread
          python -m pytest tests/test_sandbox.py tests/test_sandbox_windows.py tests/test_sandbox_gate.py -n auto -q --timeout=300 --timeout-method=thread

  # ── Science-extras suite (the half the thin matrix silently skips) ─────────
  # The `check` matrix installs `[dev,thin]`, and `thin` deliberately contains
  # NONE of the heavy data-science libraries — so eight test modules and ~25
  # `pytest.importorskip` gates (numpy, pandas, scipy, pyarrow, matplotlib via
  # pingouin -> seaborn, lifelines) skip silently on all 12 cells of every run.
  # Until this job the science stack was installed only by release.yml, i.e.
  # first exercised at tag time: for a project whose headline feature is
  # statistics and data science, that half was effectively untested in CI.
  # The fix is deliberately narrow — ONE cell (ubuntu-latest / 3.13), because
  # the stack is a large download and the code behind those gates is
  # platform-independent pure Python. It does not widen the 12-cell matrix.
  #
  # `hdf5`, `stats-io` and `satellite` are installed too. They were held back on
  # a CI download budget that turned out not to bind: each is a SINGLE
  # dependency (h5py, pyreadstat, sgp4), a few MB between them — not the ~0.84 GB
  # `[all]` install the budget was really about. Their import gates were the last
  # ones skipping on all 12 matrix cells.
  science:
    name: science extras (numpy/pandas/scipy suite the matrix skips)
    runs-on: ubuntu-latest
    # A backstop, not an estimate: the suite takes minutes here. Without it a
    # hung test holds the runner until GitHub's 6-hour ceiling — which is how
    # this job's second run ended, burning six hours to report nothing.
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 6.11 needs libEGL/libGL even offscreen (see the check job).
      - name: Install headless Qt system libs (Linux)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install project (dev + thin + science + the three single-dep extras)
        run: python -m pip install -e ".[dev,thin,science,hdf5,stats-io,satellite]"

      # Same headless-Qt invocation as the check/coverage jobs: xvfb-run for the
      # QApplication the GUI tests build, offscreen platform from the job env,
      # `-n auto` as the coverage job already uses.
      #
      # This job briefly ran serially, on the theory that four xdist workers
      # each carrying numpy + pandas + scipy + scikit-learn + statsmodels +
      # matplotlib exhausted the runner — its first run died with ENOMEM in
      # test_pyz, test_restricted_tier and test_ptyterm. That was the wrong
      # reading. The real cause was test_proclimits applying its rlimits to the
      # pytest process itself (fixed in 58e99c1): only the one worker that ran
      # that file was capped, which is exactly why only its tests failed.
      # Memory was never the constraint — that same run completed 4499 tests in
      # 99s — and going serial made it worse, spreading the cap over every
      # remaining test and turning a fast failure into a hang that burned six
      # hours against GitHub's job ceiling.
      #
      # --timeout is what finally named it, and it stays. A hung test now fails
      # with every thread's stack dumped instead of the job dying anonymously —
      # stdout through a pipe is block-buffered, so the last flushed line sits
      # far behind a hang and cannot be used to find one. 300s is far above any
      # healthy test here; timeout_method=thread fires even inside a blocking
      # C call, and works per-worker under xdist.
      - name: Run the full suite (science import gates open)
        run: xvfb-run -a python -m pytest -n auto --timeout=300 --timeout-method=thread

  # ── Coverage ratchets on abax/core and abax/engine ─────────────────────────
  # Both packages are gated, and both gates fail in BOTH directions — below the
  # floor (a regression) and too far above it (a floor nobody raised). That
  # second half is what makes these ratchets rather than floors, and it exists
  # because calling them ratchets for a year did not move them: core sat at 81
  # against a measured 84, engine at 57 against a measured 63, i.e. a gate
  # permitting a six-point regression while reporting success. See
  # scripts/coverage_ratchet.py for the reasoning and the rejected alternatives.
  #
  # Runs once (Linux / 3.13) — coverage of pure-Python logic is
  # platform-independent. One suite run collects BOTH packages; each is then
  # gated separately. NOTE: this job installs only `[dev,thin]`, so engine
  # adapters needing the heavy optional deps (numpy/pandas/pymc/…) are
  # importorskip'd and don't execute here — engine coverage is the THIN-env
  # number, and its floor must only ever be compared against another thin run.
  coverage:
    name: coverage (abax/core + abax/engine ratchets)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # PySide6 6.11 needs libEGL/libGL even offscreen (see the check job).
      - name: Install headless Qt system libs (Linux)
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1

      - name: Install project (dev + thin extras)
        run: python -m pip install -e ".[dev,thin]"

      # One suite run collects both packages into .coverage; the report steps
      # below apply per-package floors.
      - name: Run tests with coverage (collect core + engine)
        run: >
          xvfb-run -a python -m pytest -n auto
          --cov=abax/core --cov=abax/engine --cov-report=

      # The human-readable table, once, for whoever reads the log. The verdict
      # is the ratchet steps below; this step must not gate anything itself.
      - name: Coverage report (informational)
        run: python -m coverage report --include="abax/core/*,abax/engine/*"

      # Floor = measured (84%) rounded DOWN, per the house rule that keeps a
      # sub-point buffer. Slack 3: the gate demands a bump once real work puts
      # coverage more than 3 points clear of the floor. Raising it is a one-line
      # edit here, and the failure message names the number to write.
      - name: abax/core coverage ratchet
        run: >
          python scripts/coverage_ratchet.py
          --include "abax/core/*" --floor 83 --slack 3

      # Thin-env number: adapters needing the heavy optional deps
      # (numpy/pandas/pymc/…) are importorskip'd in this job, so
      # npkernel/parquet/statfiles/… stay low. Measured 63%, floor 62.
      - name: abax/engine coverage ratchet
        run: >
          python scripts/coverage_ratchet.py
          --include "abax/engine/*" --floor 62 --slack 3

  # ── Benchmark regression gate ──────────────────────────────────────────────
  # Runs the recalc throughput gate against scripts/bench_baseline.json and
  # fails only if a metric regresses beyond the lenient threshold (default 30%).
  # Single runner; the baseline was captured on a developer machine, so the
  # generous threshold absorbs the CPU difference — this catches algorithmic
  # regressions, not raw-clock differences between machines.
  bench:
    name: benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # The gate touches only abax.core (stdlib-only) via the profiler's
      # workload builder, so no extras are needed here.
      - name: Install project
        run: python -m pip install -e .

      - name: Run benchmark gate
        run: python scripts/bench_gate.py
