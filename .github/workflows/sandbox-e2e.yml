name: sandbox e2e (hunt)

# Repeat-runs the Windows AppContainer confinement tier on a hosted runner, to
# hunt an INTERMITTENT failure. Not a gate — ci.yml's `check` matrix already runs
# this tier on all four windows-latest cells on every push.
#
# History, because it explains why this file still exists. It began as a probe of
# a standing claim: that a hosted Windows runner could not launch an
# AppContainer-confined child. Two runs disproved it (#3) — the five
# direct-launcher tests passed in about four seconds. The one that did fail
# turned out to be a mundane device restriction: the confined worker opens
# os.devnull at startup to keep stray prints out of the frame stream, and an
# AppContainer denies `nul` (#6). With that fixed the whole tier passes here, the
# gate was deleted, and the probe's original question is answered.
#
# What it is for now is #9: a confined child that intermittently dies during
# interpreter startup with `Failed to import encodings module` /
# `init_fs_encoding: failed to get the Python codec of the filesystem encoding`.
# Observed with every icacls grant returning 0, `unreachable` empty, and
# /findsid confirming the ACE present — so it is NOT the silent-grant-failure
# mechanism of #8, and a pre-launch check cannot see it. It resisted repetition
# locally: once, then 15+ clean runs.
#
# An intermittent failure needs repetition, which is what `runs` gives you.
# Dispatch it with a higher count when you want to characterise #9; a single
# green run proves nothing about it.

on:
  workflow_dispatch:
    inputs:
      runs:
        description: "How many times to repeat the tier (hunting #9)"
        required: false
        default: "5"
  push:

permissions:
  contents: read

jobs:
  sandbox-e2e:
    name: Windows AppContainer tier, repeated
    # Never on an ordinary push. On a pull_request event head_commit is null and
    # contains(null, ...) is false, so the marker path is push-only by design.
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[sandbox-e2e]')
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      # `thin` brings PySide6: the ConsoleBridge member of the tier drives the
      # confinement through the GUI console.
      - name: Install project (dev + thin extras)
        run: python -m pip install -e ".[dev,thin]"

      # -v/-rs so a SKIP is as legible as a failure: a skip here would mean the
      # tier stopped running and measured nothing, which must never be mistakable
      # for a pass. --timeout names a hung confined child rather than letting it
      # consume the job budget anonymously.
      #
      # Each iteration is reported separately and the loop does not stop early —
      # the interesting datum for #9 is *how many* of N runs failed, not that one
      # did. `$LASTEXITCODE` is checked per iteration and the job fails at the end
      # if any run did.
      - name: Repeat the confinement tier
        shell: pwsh
        run: |
          $runs = if ($env:RUNS) { [int]$env:RUNS } else { 5 }
          $failed = 0
          for ($i = 1; $i -le $runs; $i++) {
            Write-Host "--- run $i of $runs ---"
            python -m pytest tests/test_sandbox.py tests/test_sandbox_windows.py `
              -m sandbox_e2e -v -rs --timeout=300 --timeout-method=thread
            if ($LASTEXITCODE -ne 0) { $failed++ ; Write-Host "run $i FAILED" }
          }
          Write-Host "=== $failed of $runs runs failed ==="
          if ($failed -gt 0) { exit 1 }
        env:
          RUNS: ${{ github.event.inputs.runs }}
